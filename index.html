<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARTMATE - Digital Order Pad</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="js/storage.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="logo">🍔</div>

     <h1>CARTMATE</h1>
      <div class="subtitle">
        <span>•</span>
        DIGITAL ORDER PAD
        <span>•</span>
      </div>

    </header>


    <!-- NAVIGATION -->
    <nav class="tabs">

      <button class="tab active" data-view="order">
        New Order
      </button>

      <button class="tab" data-view="earnings">
        Earnings
      </button>

      <button class="tab" data-view="menu">
        Menu
      </button>

    </nav>


    <!-- NEW ORDER -->
    <section id="orderView" class="view active">

      <label class="label">
        CUSTOMER NAME
      </label>

      <div class="input-wrapper">

        <input
          type="text"
          id="customerName"
          placeholder="e.g. Priya"
        >

        <button id="clearCustomer">×</button>

      </div>


      <!-- FOOD ITEMS -->
      <div id="foodList" class="food-list"></div>


      <!-- TOTAL -->
      <div class="total-box">

        <span>TOTAL</span>

        <strong id="totalAmount">
          ₹0
        </strong>

      </div>


      <!-- PAYMENT -->
      <div class="payment">

        <button
          class="payment-btn active"
          data-payment="Cash"
        >
          Cash
        </button>

        <button
          class="payment-btn"
          data-payment="UPI"
        >
          UPI
        </button>

      </div>


      <button
        id="completeOrder"
        class="complete-btn"
      >
        Complete Order
      </button>

    </section>


    <!-- EARNINGS -->
    <section id="earningsView" class="view">

      <div class="page-title">
        Earnings
      </div>

      <div class="earning-card">

        <span>Today's Earnings</span>

        <strong id="todayEarnings">
          ₹0
        </strong>

      </div>

      <div class="earning-card">

        <span>Total Orders</span>

        <strong id="todayOrders">
          0
        </strong>

      </div>

      <div class="orders-title">
        Recent Orders
      </div>

      <div id="ordersList"></div>

    </section>


    <!-- MENU -->
    <section id="menuView" class="view">

      <div class="page-title">
        Menu
      </div>


      <div class="add-item">

        <input
          id="itemName"
          type="text"
          placeholder="Food name"
        >

        <input
          id="itemPrice"
          type="number"
          placeholder="Price"
        >

        <button id="addItem">
          Add Item
        </button>

      </div>


      <div id="menuList"></div>

    </section>


    <!-- MESSAGE -->
    <div id="message" class="message"></div>

  </main>

</body>
</html>
